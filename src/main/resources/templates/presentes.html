<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Presentes - Tuani e João</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/convidados.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR PÚBLICA -->
<nav class="navbar navbar-expand-lg navbar-convidados sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/presentes}">💍 Tuani & João</a>

        <!-- Botão Hambúrguer para Celular -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuConvidados">
            <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuConvidados">
            <ul class="navbar-nav ms-auto text-center">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/presentes}">Lista de Presentes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Confirmar Presença</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Informações</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CARROSSEL DE FOTOS -->
<div class="container mb-5 px-0 px-md-3">
    <div id="noivosCarousel" class="carousel slide shadow-sm" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <!-- Imagem de exemplo, depois você troca pelas fotos reais -->
                <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=2069&auto=format&fit=crop" class="d-block w-100" alt="Foto dos Noivos 1">
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80&w=2070&auto=format&fit=crop" class="d-block w-100" alt="Foto dos Noivos 2">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#noivosCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#noivosCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Próximo</span>
        </button>
    </div>
</div>

<!-- VITRINE DE PRESENTES (ESTILO E-COMMERCE) -->
<div class="container mb-5">
    <div class="text-center mb-5">
        <h2 style="color: var(--terracotta);">Nossa Lista de Presentes</h2>
        <p class="text-muted">Agradecemos de coração por fazer parte deste momento especial.</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        <!-- Renderiza os presentes dinamicamente -->
        <div class="col" th:each="gift : ${gifts}">
            <div class="card gift-card d-flex flex-column">
                <div class="gift-img-container">
                    <img th:src="${gift.photoUrl}" alt="Presente">
                </div>
                <div class="card-body d-flex flex-column text-center">
                    <h5 class="gift-title" th:text="${gift.name}">Nome do Presente</h5>
                    <p class="card-text text-muted small flex-grow-1" th:text="${gift.description}">Descrição</p>
                    <h4 class="gift-price mb-3" th:text="|R$ ${#numbers.formatDecimal(gift.price, 1, 'POINT', 2, 'COMMA')}|">R$ 0,00</h4>

                    <!-- Botão de Comprar (Chama a função de pagamento que já temos) -->
                    <button class="btn btn-presentear w-100 mt-auto" th:onclick="'abrirModalDadosPessoais(' + ${gift.id} + ', ' + ${gift.price} + ')'">
                        🎁 Presentear
                    </button>
                </div>
            </div>
        </div>

        <!-- Mensagem se a lista estiver vazia -->
        <div class="col-12 text-center py-5" th:if="${gifts == null or #lists.isEmpty(gifts)}">
            <h5 class="text-muted">Os noivos estão preparando a lista com muito carinho. Volte em breve!</h5>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
