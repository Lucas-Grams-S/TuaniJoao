<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Presentes - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/painel-noivos}">💍 Casamento Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/painel-noivos}">Novo Cadastro</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/painel-noivos/gifts}">Ver Presentes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/painel-noivos/guests}">Ver Convidados</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🎁 Catálogo de Presentes Cadastrados</h2>
        <a th:href="@{/admin}" class="btn btn-outline-primary">+ Adicionar Mais</a>
    </div>

    <div class="card p-4">
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Foto</th>
                    <th>Nome do Presente</th>
                    <th>Preço</th>
                    <th>Descrição</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${gifts == null or #lists.isEmpty(gifts)}">
                    <td colspan="5" class="text-center py-5 text-muted">
                        <h5>Nenhum presente na lista 🎁</h5>
                        <p>Você ainda não cadastrou nenhum presente no banco de dados.</p>
                    </td>
                </tr>

                <tr th:unless="${gifts == null or #lists.isEmpty(gifts)}" th:each="gift : ${gifts}">
                    <td th:text="${gift.id}">1</td>
                    <td>
                        <img th:src="${gift.photoUrl}" alt="Foto" class="preview-img" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
                    </td>
                    <td th:text="${gift.name}">Nome</td>
                    <td th:text="|R$ ${gift.price != null ? #numbers.formatDecimal(gift.price, 1, 'POINT', 2, 'COMMA') : '0,00'}|">R$ 0,00</td>
                    <td class="text-truncate" style="max-width: 250px;" th:text="${gift.description}">Descrição</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
