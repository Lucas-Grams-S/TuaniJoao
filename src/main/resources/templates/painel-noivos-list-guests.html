<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Convidados - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/painel-noivos}">💍 Casamento Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/painel-noivos}">Novo Cadastro</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/painel-noivos/gifts}">Ver Presentes</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/painel-noivos/guests}">Ver Convidados</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>👥 Lista Oficial de Convidados</h2>
        <a th:href="@{/admin}" class="btn btn-outline-primary">Importar CSV</a>
    </div>

    <div class="card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome do Convidado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${guests == null or #lists.isEmpty(guests)}">
                    <td colspan="2" class="text-center py-5 text-muted">
                        <h5>Lista Vazia 👥</h5>
                        <p>Nenhum convidado foi importado para o sistema ainda.</p>
                    </td>
                </tr>

                <tr th:unless="${guests == null or #lists.isEmpty(guests)}" th:each="guest : ${guests}">
                    <td th:text="${guest.id}">1</td>
                    <td th:text="${guest.name}">Nome do Convidado</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
