<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Colaborativo - Tuani & João</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/convidados.css}" rel="stylesheet">
    <style>
        .album-card {
            max-width: 450px;
            margin: 0 auto;
            border-radius: 16px;
        }
        .btn-upload {
            background-color: var(--terracotta, #c86d51);
            color: white;
            font-weight: bold;
            padding: 14px;
            border-radius: 50px;
            border: none;
        }
        .btn-upload:hover {
            background-color: #b05c42;
            color: white;
        }
        #previewFoto {
            max-height: 280px;
            object-fit: cover;
            border-radius: 12px;
            display: none;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">
    <!-- Botão voltar / Cabeçalho -->
    <div class="text-center mb-4">
        <h3 class="mt-2 fw-bold" style="color: var(--slate-blue, #4a5568);">📸 Mural dos Noivos</h3>
        <p class="text-muted small">Compartilhe sua foto com a Tuani e o João!</p>
    </div>

    <!-- Card Principal de Upload -->
    <div class="card shadow-sm border-0 album-card p-4">
        <form id="formAlbum">
            <!-- Campo de Nome (Opcional) -->
            <div class="mb-3">
                <label for="nomeConvidado" class="form-label small text-muted">Seu nome (opcional):</label>
                <input type="text" id="nomeConvidado" class="form-control" placeholder="Ex: Tia Maria">
            </div>

            <!-- Dois Inputs Escondidos -->
            <!-- 1. Exclusivo para câmera (apenas 1 foto por vez) -->
            <input type="file" id="fotoCamera" accept="image/*" capture="environment" class="d-none">

            <!-- 2. Exclusivo para galeria (com atributo multiple para lote) -->
            <input type="file" id="fotoGaleria" accept="image/*, image/jpeg, image/png, image/webp" multiple class="d-none">

            <!-- Dois Botões Lado a Lado -->
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <button type="button" id="btnAbrirCamera" class="btn btn-outline-secondary w-100 py-3 fw-bold rounded-3">
                        📷 Tirar Foto
                    </button>
                </div>
                <div class="col-6">
                    <button type="button" id="btnAbrirGaleria" class="btn btn-outline-secondary w-100 py-3 fw-bold rounded-3">
                        🖼️ da Galeria (Até 10)
                    </button>
                </div>
            </div>

            <!-- Preview em Grade (Grid) para mostrar todas as selecionadas -->
            <div id="containerPreview" class="row g-2 mb-3 d-none">
                <!-- As miniaturas serão injetadas via JavaScript aqui -->
            </div>

            <!-- Botão de Enviar -->
            <div class="d-grid gap-2">
                <button type="submit" id="btnEnviar" class="btn btn-upload shadow-sm d-none">
                    🚀 Enviar para os Noivos!
                </button>
            </div>
        </form>

        <!-- Mensagem de Sucesso / Erro -->
        <div id="mensagemStatus" class="alert mt-3 d-none text-center small mb-0" role="alert"></div>
    </div>
</div>

<script>
    const fotoInput = document.getElementById('fotoInput');
    const btnEscolherFoto = document.getElementById('btnEscolherFoto');
    const previewFoto = document.getElementById('previewFoto');
    const btnEnviar = document.getElementById('btnEnviar');
    const formAlbum = document.getElementById('formAlbum');
    const mensagemStatus = document.getElementById('mensagemStatus');

    let arquivoComprimidoParaEnvio = null;

    // 1. Ao clicar no botão visível, aciona o input file escondido
    btnEscolherFoto.addEventListener('click', () => {
        fotoInput.click();
    });

    // 2. Quando o convidado escolhe/tira a foto, nós COMPRIMIMOS antes do preview
    fotoInput.addEventListener('change', async function() {
        const arquivoOriginal = this.files[0];
        if (!arquivoOriginal) return;

        btnEscolherFoto.disabled = true;
        btnEscolherFoto.textContent = '⏳ Otimizando foto...';

        try {
            // Comprime a foto no celular para no máximo 1600px e 80% de qualidade
            arquivoComprimidoParaEnvio = await comprimirImagem(arquivoOriginal, 1600, 0.8);

            // Mostra o preview otimizado
            const urlPreview = URL.createObjectURL(arquivoComprimidoParaEnvio);
            previewFoto.src = urlPreview;
            previewFoto.style.display = 'block';
            btnEnviar.classList.remove('d-none');
            mensagemStatus.classList.add('d-none');
        } catch (erro) {
            alert('Não foi possível processar a foto. Tente novamente.');
            console.error(erro);
        } finally {
            btnEscolherFoto.disabled = false;
            btnEscolherFoto.textContent = '🔄 Escolher outra foto';
        }
    });

    // 3. Envia a FOTO COMPRIMIDA via Fetch
    formAlbum.addEventListener('submit', async function(event) {
        event.preventDefault();

        if (!arquivoComprimidoParaEnvio) return;

        const formData = new FormData();
        // Envia o arquivo leve otimizado ao invés de fotoInput.files[0]
        formData.append('foto', arquivoComprimidoParaEnvio, 'foto_album.jpg');
        formData.append('nome', document.getElementById('nomeConvidado').value || 'Convidado');

        btnEnviar.disabled = true;
        btnEnviar.textContent = '⏳ Enviando foto...';

        try {
            const resposta = await fetch('/api/album/upload', {
                method: 'POST',
                body: formData
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                mensagemStatus.className = 'alert alert-success mt-3 text-center small mb-0';
                mensagemStatus.textContent = dados.message;
                mensagemStatus.classList.remove('d-none');

                setTimeout(() => {
                    formAlbum.reset();
                    previewFoto.style.display = 'none';
                    btnEnviar.classList.add('d-none');
                    btnEscolherFoto.textContent = '📷 Tirar outra foto';
                    btnEnviar.disabled = false;
                    btnEnviar.textContent = '🚀 Enviar para os Noivos!';
                    arquivoComprimidoParaEnvio = null;
                }, 3000);
            } else {
                throw new Error(dados.message || 'Erro ao enviar foto.');
            }
        } catch (erro) {
            mensagemStatus.className = 'alert alert-danger mt-3 text-center small mb-0';
            mensagemStatus.textContent = 'Não foi possível enviar a foto. Tente novamente.';
            mensagemStatus.classList.remove('d-none');
            btnEnviar.disabled = false;
            btnEnviar.textContent = '🚀 Enviar para os Noivos!';
        }
    });

    /**
     * Função auxiliar: Redimensiona e comprime imagem direto no navegador (Canvas)
     */
    function comprimirImagem(arquivo, ladoMaximo, qualidade) {
        return new Promise((resolve, reject) => {
            const leitor = new FileReader();
            leitor.readAsDataURL(arquivo);
            leitor.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    let largura = img.width;
                    let altura = img.height;

                    // Redimensiona mantendo a proporção da imagem
                    if (largura > altura) {
                        if (largura > ladoMaximo) {
                            altura = Math.round((altura * ladoMaximo) / largura);
                            largura = ladoMaximo;
                        }
                    } else {
                        if (altura > ladoMaximo) {
                            largura = Math.round((largura * ladoMaximo) / altura);
                            altura = ladoMaximo;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = largura;
                    canvas.height = altura;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, largura, altura);

                    // Converte o canvas para um arquivo Blob (JPEG otimizado)
                    canvas.toBlob(
                        (blob) => {
                            if (blob) {
                                resolve(new File([blob], 'foto_comprimida.jpg', { type: 'image/jpeg' }));
                            } else {
                                reject(new Error('Erro na compressão do canvas.'));
                            }
                        },
                        'image/jpeg',
                        qualidade
                    );
                };
                img.onerror = (erro) => reject(erro);
            };
            leitor.onerror = (erro) => reject(erro);
        });
    }
</script>
</body>
</html>
