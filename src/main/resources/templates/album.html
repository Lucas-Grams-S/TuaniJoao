<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Colaborativo - Tuani & João</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/convidados.css}" rel="stylesheet">
    <style>
        .album-card {
            max-width: 450px;
            margin: 0 auto;
            border-radius: 16px;
        }
        .btn-upload {
            background-color: var(--terracotta, #c86d51);
            color: white;
            font-weight: bold;
            padding: 14px;
            border-radius: 50px;
            border: none;
        }
        .btn-upload:hover {
            background-color: #b05c42;
            color: white;
        }
        #previewFoto {
            max-height: 280px;
            object-fit: cover;
            border-radius: 12px;
            display: none;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="text-center mb-4">
        <h3 class="mt-2 fw-bold" style="color: var(--slate-blue, #4a5568);">📸 Mural dos Noivos</h3>
        <p class="text-muted small">Compartilhe sua foto com a Tuani e o João!</p>
    </div>

    <div class="card shadow-sm border-0 album-card p-4">
        <form id="formAlbum">
            <div class="mb-3">
                <label for="nomeConvidado" class="form-label small text-muted">Seu nome (opcional):</label>
                <input type="text" id="nomeConvidado" class="form-control" placeholder="Ex: Tia Maria">
            </div>

            <input type="file" id="fotoCamera" accept="image/*" capture="environment" class="d-none">

            <input type="file" id="fotoGaleria" accept="image/*, image/jpeg, image/png, image/webp" multiple class="d-none">

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <button type="button" id="btnAbrirCamera" class="btn btn-outline-secondary w-100 py-3 fw-bold rounded-3">
                        📷 Tirar Foto
                    </button>
                </div>
                <div class="col-6">
                    <button type="button" id="btnAbrirGaleria" class="btn btn-outline-secondary w-100 py-3 fw-bold rounded-3">
                        🖼️ da Galeria (Até 10)
                    </button>
                </div>
            </div>

            <div id="containerPreview" class="row g-2 mb-3 d-none">
            </div>

            <div class="d-grid gap-2">
                <button type="submit" id="btnEnviar" class="btn btn-upload shadow-sm d-none">
                    🚀 Enviar para os Noivos!
                </button>
            </div>
        </form>

        <div id="mensagemStatus" class="alert mt-3 d-none text-center small mb-0" role="alert"></div>
    </div>
</div>

<script>
    const fotoCamera = document.getElementById('fotoCamera');
    const fotoGaleria = document.getElementById('fotoGaleria');
    const btnAbrirCamera = document.getElementById('btnAbrirCamera');
    const btnAbrirGaleria = document.getElementById('btnAbrirGaleria');
    const containerPreview = document.getElementById('containerPreview');
    const btnEnviar = document.getElementById('btnEnviar');
    const formAlbum = document.getElementById('formAlbum');
    const mensagemStatus = document.getElementById('mensagemStatus');

    let fotosComprimidasParaEnvio = [];

    btnAbrirCamera.addEventListener('click', () => fotoCamera.click());
    btnAbrirGaleria.addEventListener('click', () => fotoGaleria.click());

    const processarFotosEscolhidas = async function(event) {
        let arquivos = Array.from(event.target.files);
        if (arquivos.length === 0) return;

        if (arquivos.length > 10) {
            alert('Você selecionou ' + arquivos.length + ' fotos. Escolha no máximo 10 fotos por vez!');
            event.target.value = '';
            return;
        }

        btnAbrirCamera.disabled = true;
        btnAbrirGaleria.disabled = true;
        btnAbrirCamera.textContent = '⏳...';
        btnAbrirGaleria.textContent = '⏳...';
        mensagemStatus.classList.add('d-none');

        try {
            fotosComprimidasParaEnvio = [];
            containerPreview.innerHTML = '';
            containerPreview.classList.remove('d-none');

            for (let i = 0; i < arquivos.length; i++) {
                const fotoOtimizada = await comprimirImagem(arquivos[i], 1600, 0.8);
                fotosComprimidasParaEnvio.push(fotoOtimizada);

                const urlPreview = URL.createObjectURL(fotoOtimizada);
                const colDiv = document.createElement('div');
                colDiv.className = 'col-4 col-sm-3 text-center';
                colDiv.innerHTML = `
                    <img src="${urlPreview}" class="img-fluid shadow-sm rounded-2"
                         style="height: 90px; width: 100%; object-fit: cover;">
                `;
                containerPreview.appendChild(colDiv);
            }

            btnEnviar.classList.remove('d-none');
            const textoBotao = fotosComprimidasParaEnvio.length === 1
                ? '🚀 Enviar 1 Foto para os Noivos!'
                : `🚀 Enviar ${fotosComprimidasParaEnvio.length} Fotos para os Noivos!`;
            btnEnviar.textContent = textoBotao;

        } catch (erro) {
            alert('Não foi possível processar as fotos. Tente novamente.');
            console.error(erro);
        } finally {
            btnAbrirCamera.disabled = false;
            btnAbrirGaleria.disabled = false;
            btnAbrirCamera.textContent = '📷 Tirar Foto';
            btnAbrirGaleria.textContent = '🖼️ da Galeria (Até 10)';
            event.target.value = ''; // Limpa o input para permitir selecionar as mesmas depois se quiser
        }
    };

    fotoCamera.addEventListener('change', processarFotosEscolhidas);
    fotoGaleria.addEventListener('change', processarFotosEscolhidas);

    formAlbum.addEventListener('submit', async function(event) {
        event.preventDefault();

        if (fotosComprimidasParaEnvio.length === 0) return;

        const formData = new FormData();
        fotosComprimidasParaEnvio.forEach((foto, index) => {
            formData.append('fotos', foto, `foto_album_${index}.jpg`);
        });
        formData.append('nome', document.getElementById('nomeConvidado').value || 'Convidado');

        btnEnviar.disabled = true;
        btnEnviar.textContent = '⏳ Enviando fotos...';

        try {
            const resposta = await fetch('/api/album/upload', {
                method: 'POST',
                body: formData
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                mensagemStatus.className = 'alert alert-success mt-3 text-center small mb-0';
                mensagemStatus.textContent = dados.message;
                mensagemStatus.classList.remove('d-none');

                setTimeout(() => {
                    formAlbum.reset();
                    containerPreview.innerHTML = '';
                    containerPreview.classList.add('d-none');
                    btnEnviar.classList.add('d-none');
                    btnEnviar.disabled = false;
                    fotosComprimidasParaEnvio = [];
                }, 3000);
            } else {
                throw new Error(dados.message || 'Erro ao enviar fotos.');
            }
        } catch (erro) {
            mensagemStatus.className = 'alert alert-danger mt-3 text-center small mb-0';
            mensagemStatus.textContent = 'Não foi possível enviar as fotos. Tente novamente.';
            mensagemStatus.classList.remove('d-none');
            btnEnviar.disabled = false;
            btnEnviar.textContent = '🚀 Enviar para os Noivos!';
        }
    });

    function comprimirImagem(arquivo, ladoMaximo, qualidade) {
        return new Promise((resolve, reject) => {
            const leitor = new FileReader();
            leitor.readAsDataURL(arquivo);
            leitor.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    let largura = img.width;
                    let altura = img.height;

                    if (largura > altura) {
                        if (largura > ladoMaximo) {
                            altura = Math.round((altura * ladoMaximo) / largura);
                            largura = ladoMaximo;
                        }
                    } else {
                        if (altura > ladoMaximo) {
                            largura = Math.round((largura * ladoMaximo) / altura);
                            altura = ladoMaximo;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = largura;
                    canvas.height = altura;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, largura, altura);

                    canvas.toBlob(
                        (blob) => {
                            if (blob) {
                                resolve(new File([blob], 'foto_comprimida.jpg', { type: 'image/jpeg' }));
                            } else {
                                reject(new Error('Erro na compressão do canvas.'));
                            }
                        },
                        'image/jpeg',
                        qualidade
                    );
                };
                img.onerror = (erro) => reject(erro);
            };
            leitor.onerror = (erro) => reject(erro);
        });
    }
</script>
</body>
</html>
