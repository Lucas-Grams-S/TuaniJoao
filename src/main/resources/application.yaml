spring:
  application:
    name: TuaniJoao

  datasource:
    # Lê a porta e o banco, mas se não achar, usa 5432 e casamentodb
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:casamentodb}

    # Lê o usuário, se não achar, usa tuani_joao_local
    username: ${DB_USER:tuani_joao_local}

    # Lê a senha, se não achar, usa senha_de_teste
    password: ${DB_PASSWORD:senha_de_teste}
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true

    servlet:
      multipart:
        max-file-size: 50MB
        max-request-size: 50000MB
