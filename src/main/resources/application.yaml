spring:
  application:
    name: TuaniJoao

  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:chave_falsa_local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:casamentodb}
    username: ${DB_USER:tuani_joao_local}
    password: ${DB_PASSWORD:senha_de_teste}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB